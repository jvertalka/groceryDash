<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Grocery Dash 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0b0d10; overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #eef2f6; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* first-run loading */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(120% 90% at 50% 30%, #16202b, #090b0e); z-index: 30; transition: opacity .6s; }
    #boot h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; }
    #boot h1 span { opacity: .5; font-weight: 500; }
    #boot .bar { width: 260px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #35c46a, #8be0a4); transition: width .3s; }
    #boot .msg { font-size: 12.5px; opacity: .6; letter-spacing: .3px; }

    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 2px rgba(0,0,0,.35); display: none; z-index: 12; }
    #hint { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); font-size: 13px; opacity: .0; background: rgba(10,14,18,.7); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.12); transition: opacity .3s; z-index: 12; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="hint">Click to look around · WASD to move · Esc to release</div>
  <div id="boot">
    <h1>GROCERY DASH <span>3D</span></h1>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="msg" id="bootmsg">Loading store…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
