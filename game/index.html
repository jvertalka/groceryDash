<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Grocery Dash 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #0b0d10; overflow: hidden; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #eef2f6; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* first-run loading */
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(120% 90% at 50% 30%, #16202b, #090b0e); z-index: 30; transition: opacity .6s; }
    #boot h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; }
    #boot h1 span { opacity: .5; font-weight: 500; }
    #boot .bar { width: 260px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #35c46a, #8be0a4); transition: width .3s; }
    #boot .msg { font-size: 12.5px; opacity: .6; letter-spacing: .3px; }

    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 0 2px rgba(0,0,0,.35); display: none; z-index: 12; }
    #hint { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); font-size: 13px; opacity: 0; background: rgba(10,14,18,.7); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.12); transition: opacity .3s; z-index: 12; }
    #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 10; background: radial-gradient(115% 90% at 50% 46%, transparent 62%, rgba(0,0,0,.32)); }

    /* HUD */
    #list { position: fixed; left: 18px; top: 18px; z-index: 12; background: rgba(10,14,18,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 12px 14px; min-width: 210px; backdrop-filter: blur(4px); }
    #list h3 { font-size: 11.5px; letter-spacing: 1.4px; opacity: .65; margin-bottom: 8px; }
    #list .row { font-size: 13.5px; padding: 3px 0; display: flex; align-items: center; gap: 8px; }
    #list .row .chk { width: 15px; opacity: .7; }
    #list .row .pr { margin-left: auto; opacity: .5; font-size: 12px; }
    #list .row.ok { opacity: .48; text-decoration: line-through; }
    #list .row.ok .chk { color: #35c46a; opacity: 1; }
    #list .foot { margin-top: 8px; font-size: 11px; opacity: .55; border-top: 1px solid rgba(255,255,255,.1); padding-top: 7px; }
    #timer { position: fixed; right: 18px; top: 18px; z-index: 12; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; background: rgba(10,14,18,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 8px 16px; }
    #prompt { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 12; display: none; font-size: 14.5px; background: rgba(10,14,18,.82); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 9px 16px; }
    #prompt .key { display: inline-block; border: 1px solid rgba(255,255,255,.5); border-radius: 5px; padding: 0 7px; font-weight: 700; font-size: 12.5px; margin: 0 2px; }
    #banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); z-index: 14; display: none; text-align: center; background: rgba(10,14,18,.9); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 22px 34px; font-size: 16px; }
    #banner h2 { font-size: 22px; margin-bottom: 6px; }
    #banner .big { font-size: 34px; font-weight: 800; margin: 8px 0; }
    #banner .dim { opacity: .55; font-size: 13px; }
    #toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 13; font-size: 14.5px; font-weight: 600; background: rgba(10,14,18,.85); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 8px 16px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="crosshair"></div>
  <div id="hint">Click to play · WASD move · Shift sprint · E take item · M mute</div>
  <div id="list"></div>
  <div id="timer">0:00</div>
  <div id="prompt"></div>
  <div id="banner"></div>
  <div id="boot">
    <h1>GROCERY DASH <span>3D</span></h1>
    <div class="bar"><i id="bootbar"></i></div>
    <div class="msg" id="bootmsg">Loading store…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
