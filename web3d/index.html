<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grocery Dash 3D — proof of concept</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { position: fixed; inset: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 3;
    box-shadow: inset 0 0 220px 70px rgba(0,0,0,.40); }
  #hud { position: fixed; left: 14px; top: 12px; color: #fff; font-size: 13px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; line-height: 1.5; }
  #hud b { font-size: 15px; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
    margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.7);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4); pointer-events: none; display: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(20,24,30,.55), rgba(8,10,13,.88));
    color: #fff; cursor: pointer; text-align: center; }
  #overlay .card { padding: 26px 34px; border: 1px solid rgba(255,255,255,.14);
    border-radius: 16px; background: rgba(255,255,255,.04); backdrop-filter: blur(4px); }
  #overlay h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: .5px; }
  #overlay p { margin: 4px 0; opacity: .85; font-size: 14px; }
  #overlay .keys { margin-top: 12px; opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="crosshair"></div>
<div id="vignette"></div>
<div id="hud"><b>Grocery&nbsp;Dash&nbsp;3D</b><br>WASD / arrows — move<br>mouse — look · Esc — release</div>
<div id="overlay"><div class="card">
  <h1>Grocery Dash <span style="opacity:.6">3D</span></h1>
  <p>A walkable 3D store — real lighting, shadows, stocked shelves.</p>
  <p class="keys">Click to enter · WASD + mouse · Esc to release</p>
</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

try {
// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

// ---------------------------------------------------------------- scene + env
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7dde3);
scene.fog = new THREE.Fog(0xd7dde3, 22, 46);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 120);
camera.position.set(0, 1.62, 9.5);
scene.add(camera); // so the first-person cart (a child of the camera) renders

// post-processing: gentle bloom so the ceiling panels + highlights glow
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
// gentle: only the emissive ceiling panels (HDR > 1.0) glow; keeps shelf
// colours + dark frames intact (a bright store blooms everything otherwise).
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.18, 0.3, 1.0));
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa6b2, 0.55));

const key = new THREE.DirectionalLight(0xfff4e2, 1.15);
key.position.set(6, 14, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 50;
key.shadow.camera.left = -16; key.shadow.camera.right = 16;
key.shadow.camera.top = 16; key.shadow.camera.bottom = -16;
key.shadow.bias = -0.00015;
scene.add(key);

// ---------------------------------------------------------------- store box
const STORE = { w: 18, d: 22, h: 3.4 };

function tileTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#dad8d0'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 4000; i++) {
    x.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
    x.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
  }
  x.strokeStyle = '#b6b2a6'; x.lineWidth = 5;
  for (let i = 0; i <= 8; i++) {
    const p = i * 64;
    x.beginPath(); x.moveTo(p, 0); x.lineTo(p, 512); x.stroke();
    x.beginPath(); x.moveTo(0, p); x.lineTo(512, p); x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(STORE.w / 1.5, STORE.d / 1.5);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(STORE.w, STORE.d),
  new THREE.MeshStandardMaterial({ map: tileTexture(), roughness: 0.5, metalness: 0.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xeef1f4, roughness: 0.9 });
function wall(w, h, x, y, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m);
}
wall(STORE.w, STORE.h, 0, STORE.h / 2, -STORE.d / 2, 0);
wall(STORE.w, STORE.h, 0, STORE.h / 2, STORE.d / 2, Math.PI);
wall(STORE.d, STORE.h, -STORE.w / 2, STORE.h / 2, 0, Math.PI / 2);
wall(STORE.d, STORE.h, STORE.w / 2, STORE.h / 2, 0, -Math.PI / 2);

// ceiling + emissive light panels
const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(STORE.w, STORE.d),
  new THREE.MeshStandardMaterial({ color: 0xf3f5f7, roughness: 1 })
);
ceiling.rotation.x = Math.PI / 2; ceiling.position.y = STORE.h; scene.add(ceiling);

const panelMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xfff6e8, emissiveIntensity: 1.4, roughness: 1
});
for (const xi of [-6, -2, 2, 6]) {
  for (const zi of [-8, -3.5, 1, 6.5]) {
    const panel = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 2.4), panelMat);
    panel.position.set(xi, STORE.h - 0.05, zi);
    scene.add(panel);
    const pl = new THREE.PointLight(0xfff2dd, 10, 13, 2.0);
    pl.position.set(xi, STORE.h - 0.4, zi);
    scene.add(pl);
  }
}

// ---------------------------------------------------------------- products
// Sampled from the game's item catalogue (id → shape + colour).
// [shape, colour, label, id, score]
const ITEMS = [
  ['box', 0xE0B040, 'CEREAL', 'cereal', 5], ['box', 0xE86A92, 'CANDY', 'candy', 5], ['pizza', 0xD2690E, 'PIZZA', 'pizza', 7], ['carton', 0xF2F2F2, 'MILK', 'milk', 5],
  ['carton', 0xE89B3C, 'JUICE', 'oj', 6], ['can', 0xB03A48, 'SOUP', 'soup', 5], ['can', 0x4FB477, 'BEANS', 'beans', 5], ['bottle', 0x8B3A3A, 'COLA', 'soda', 5],
  ['bottle', 0x6BB3E8, 'WATER', 'water', 5], ['bag', 0xE5C07B, 'CHIPS', 'chips', 5], ['bag', 0xD9A066, 'BREAD', 'bread', 5], ['apple', 0xD64545, 'APPLE', 'apple', 5],
  ['banana', 0xE8C547, 'BANANA', 'banana', 5], ['wedge', 0xE8B64C, 'CHEESE', 'cheese', 6], ['round', 0xF6B5CC, 'CAKE', 'cake', 20], ['bag', 0xEFEFEF, 'RICE', 'rice', 5],
  ['carton', 0xF5ECD7, 'EGGS', 'eggs', 8], ['box', 0xF5F5F5, 'TISSUES', 'tissues', 5], ['bag', 0xF4E1A1, 'POPCORN', 'popcorn', 5], ['bottle', 0xE8B104, 'MUSTARD', 'mustard', 5],
  ['can', 0x4FB477, 'ENERGY', 'energy', 7], ['can', 0xC0392B, 'SALSA', 'salsa', 6], ['can', 0xDFA95A, 'RAMEN', 'ramen', 6], ['tray', 0xA83A3A, 'BEEF', 'beef', 7],
  ['tray', 0xC47650, 'HOT DOGS', 'hotdog', 6], ['tray', 0xF8D6CE, 'ICE CREAM', 'icecream', 7],
];

const matCache = new Map();
function mat(color, opts = {}) {
  const k = color + JSON.stringify(opts);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.05, ...opts }));
  return matCache.get(k);
}

// Canvas-drawn packaging label so products read as real branded goods.
const labelTexCache = new Map();
function labelTexture(name, color) {
  const key = name + '|' + color;
  if (labelTexCache.has(key)) return labelTexCache.get(key);
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const x = cv.getContext('2d');
  const col = '#' + color.toString(16).padStart(6, '0');
  x.fillStyle = col; x.fillRect(0, 0, 256, 256);
  x.fillStyle = 'rgba(0,0,0,0.16)'; x.fillRect(0, 0, 256, 34); x.fillRect(0, 222, 256, 34);
  x.fillStyle = 'rgba(255,255,255,0.92)'; x.fillRect(18, 92, 220, 84);
  x.fillStyle = 'rgba(255,255,255,0.55)'; x.beginPath(); x.arc(128, 56, 11, 0, 7); x.fill();
  if (name) {
    x.fillStyle = col; x.textAlign = 'center'; x.textBaseline = 'middle';
    let fs = 46; do { x.font = 'bold ' + fs + 'px system-ui, sans-serif'; if (x.measureText(name).width <= 192) break; fs -= 2; } while (fs > 12);
    x.fillText(name, 128, 134);
  }
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  labelTexCache.set(key, t); return t;
}
const labelMatCache = new Map();
function labelMat(name, color, opts = {}) {
  const k = name + '|' + color + '|' + JSON.stringify(opts);
  if (!labelMatCache.has(k)) labelMatCache.set(k, new THREE.MeshStandardMaterial({ map: labelTexture(name, color), roughness: 0.6, metalness: 0.05, ...opts }));
  return labelMatCache.get(k);
}

function product(shape, color, name) {
  const g = new THREE.Group();
  if (shape === 'box') {
    const lm = labelMat(name, color), bm = mat(color);
    // BoxGeometry face order +x,-x,+y,-y,+z,-z → label wraps the 4 sides.
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.40, 0.20), [lm, lm, bm, bm, lm, lm]);
    b.position.y = 0.20; g.add(b);
  } else if (shape === 'carton') {
    const lm = labelMat(name, color), bm = mat(color);
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.34, 0.20), [lm, lm, bm, bm, lm, lm]);
    b.position.y = 0.17;
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.10, 0.06), bm);
    top.position.y = 0.39; g.add(b, top);
  } else if (shape === 'can') {
    // CylinderGeometry material order: side, top, bottom.
    const capM = mat(0xb9bcc0, { metalness: 0.5, roughness: 0.3 });
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.30, 24), [labelMat(name, color), capM, capM]);
    b.position.y = 0.15; g.add(b);
  } else if (shape === 'bottle') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.30, 24), mat(color, { roughness: 0.22, transparent: true, opacity: 0.88 }));
    body.position.y = 0.15;
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.13, 24, 1, true), labelMat(name, color, { side: THREE.DoubleSide }));
    band.position.y = 0.14;
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.10, 16), mat(color, { roughness: 0.25 }));
    neck.position.y = 0.35;
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.05, 16), mat(0x2b2b2b));
    cap.position.y = 0.42; g.add(body, band, neck, cap);
  } else if (shape === 'bag') {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.18, 18, 14), mat(color, { roughness: 0.85 }));
    b.scale.set(1.0, 1.25, 0.55); b.position.y = 0.22; g.add(b);
  } else if (shape === 'produce') {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 16), mat(color, { roughness: 0.5 }));
    b.position.y = 0.12; g.add(b);
  } else if (shape === 'apple') {
    const a = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 16), mat(color, { roughness: 0.4 }));
    a.scale.y = 0.92; a.position.y = 0.13; g.add(a);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.07, 6), mat(0x6b4a2a));
    stem.position.y = 0.27; g.add(stem);
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), mat(0x4AA35A));
    leaf.scale.set(1.4, 0.35, 0.8); leaf.position.set(0.055, 0.27, 0); g.add(leaf);
  } else if (shape === 'banana') {
    const bn = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.042, 10, 16, Math.PI * 0.9), mat(color, { roughness: 0.55 }));
    bn.rotation.z = Math.PI * 0.2; bn.position.y = 0.17; g.add(bn);
  } else if (shape === 'wedge') {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.18, 3), mat(color));
    b.position.y = 0.10; b.rotation.y = Math.PI / 6; g.add(b);
  } else if (shape === 'round') {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.14, 28), mat(color));
    b.position.y = 0.07; g.add(b);
  } else if (shape === 'pizza') {
    // round pie standing up, circular faces along x so it reads as a pizza
    const crust = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 24), mat(0xD9A066, { roughness: 0.85 }));
    crust.rotation.z = Math.PI / 2; crust.position.y = 0.2; g.add(crust);
    const sauce = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.055, 24), mat(0xC0392B, { roughness: 0.7 }));
    sauce.rotation.z = Math.PI / 2; sauce.position.set(0.002, 0.2, 0); g.add(sauce);
    for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; const dot = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 5), mat(0xE8B64C)); dot.position.set(0.03, 0.2 + Math.sin(a) * 0.1, Math.cos(a) * 0.1); g.add(dot); }
  } else if (shape === 'tray') {
    const tr = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.12, 0.26), mat(color));
    tr.position.y = 0.06;
    const lid = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.05, 0.26), mat(0xffffff, { transparent: true, opacity: 0.5, roughness: 0.2 }));
    lid.position.y = 0.135; g.add(tr, lid);
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// ---------------------------------------------------------------- shelving
// Logical aisle sections — each shelf unit is stocked from one section's items
// (matches the bible's grouping) and labelled with a matching sign.
const SECTIONS = [
  { name: 'PRODUCE',   color: 0xB7D8A3, items: ['apple', 'banana'] },
  { name: 'BAKERY',    color: 0xD9A066, items: ['bread', 'cake', 'cereal'] },
  { name: 'DAIRY',     color: 0xCBE3EF, items: ['milk', 'eggs', 'cheese', 'oj'] },
  { name: 'DELI',      color: 0xE8C06D, items: ['beef', 'hotdog', 'cheese'] },
  { name: 'FROZEN',    color: 0x9BC4DA, items: ['pizza', 'icecream', 'ramen'] },
  { name: 'SNACKS',    color: 0xE5B04A, items: ['chips', 'candy', 'soda', 'popcorn', 'energy'] },
  { name: 'PANTRY',    color: 0xCBB994, items: ['soup', 'beans', 'salsa', 'rice'] },
  { name: 'HOUSEHOLD', color: 0xB0ABA0, items: ['tissues', 'water', 'mustard'] },
];
const itemDef = id => ITEMS.find(t => t[3] === id);
function makeSectionSign(text, color) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0'); ctx.fillRect(0, 0, 512, 128);
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(0, 0, 512, 8); ctx.fillRect(0, 120, 512, 8);
  ctx.fillStyle = '#1c2126'; ctx.font = 'bold 64px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 70);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.45),
    new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.35, roughness: 0.7, side: THREE.DoubleSide }));
  m.castShadow = false; return m;
}
const frameMat = new THREE.MeshStandardMaterial({ color: 0x57606b, roughness: 0.4, metalness: 0.6 });
const boardMat = new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.7, metalness: 0.2 });

// section back-panel colours (produce/bakery/dairy/snacks/household/frozen)
const SECTION_COLORS = [0xB7D8A3, 0xD9A066, 0xCBE3EF, 0xE5B04A, 0xB0ABA0, 0x9BC4DA];
const shelfBoxes = []; // AABBs for collision (xz)
const shelfItems = []; // grabbable products: { id, name, score, mesh, pos, grabbed }
let _prodIdx = 0;      // global cursor so every item type gets placed evenly

function shelfUnit(cx, cz, faceX, section) {
  // A unit is long along Z (length ~4.4), depth ~0.8 along X, faces +/-X (aisle).
  const grp = new THREE.Group();
  const len = 4.4, depth = 0.8, height = 2.0;

  const back = new THREE.Mesh(new THREE.BoxGeometry(0.08, height, len),
    new THREE.MeshStandardMaterial({ color: section.color, roughness: 0.85 }));
  back.position.set(-faceX * depth / 2, height / 2, 0); grp.add(back);

  // uprights
  for (const zz of [-len / 2 + 0.05, len / 2 - 0.05]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(depth, height, 0.08), frameMat);
    post.position.set(0, height / 2, zz); grp.add(post);
  }
  // boards + products, stocked from this section's item pool
  const boardYs = [0.45, 1.0, 1.55];
  let k = 0;
  for (const by of boardYs) {
    const board = new THREE.Mesh(new THREE.BoxGeometry(depth, 0.05, len), boardMat);
    board.position.set(0, by, 0); grp.add(board);
    const n = 4;
    for (let i = 0; i < n; i++) {
      const id = section.items[k++ % section.items.length];
      const [shape, color, name, , score] = itemDef(id);
      const p = product(shape, color, name);
      p.position.set(faceX * (depth / 2 - 0.18), by + 0.025, -len / 2 + 0.35 + i * ((len - 0.7) / (n - 1)));
      grp.add(p);
      shelfItems.push({ id, name, score, shape, color, mesh: p, grabbed: false,
        pos: new THREE.Vector3(cx + p.position.x, p.position.y, cz + p.position.z) });
    }
  }
  // section sign hanging in the aisle, facing out toward the shopper
  const sign = makeSectionSign(section.name, section.color);
  sign.position.set(faceX * (depth / 2 + 0.45), height - 0.1, 0);
  sign.rotation.y = faceX > 0 ? Math.PI / 2 : -Math.PI / 2;
  grp.add(sign);

  grp.traverse(o => { if (o.isMesh) { o.receiveShadow = true; if (o !== sign) o.castShadow = true; } });
  grp.position.set(cx, 0, cz);
  scene.add(grp);
  shelfBoxes.push({ minX: cx - depth / 2 - 0.1, maxX: cx + depth / 2 + 0.1, minZ: cz - len / 2, maxZ: cz + len / 2 });
}

// Two rows flanking a central aisle; three sections deep on each side.
// four rows -> two shopping aisles (A around x=-4.25, B around x=+4.25),
// with a cross-aisle through the middle and outer aisles by the walls.
const ROWS = [
  { x: -6, face: +1 }, { x: -2.5, face: -1 }, // aisle A (between them)
  { x: 2.5, face: +1 }, { x: 6, face: -1 },   // aisle B (between them)
];
const SEG_Z = [-7, -2.5, 2];
let _sec = 0;
for (const r of ROWS) for (const cz of SEG_Z) {
  // double-sided gondola: stock BOTH faces so every aisle (incl. outer + the
  // centre cross-aisle) shows products instead of bare shelf backs.
  shelfUnit(r.x, cz, +1, SECTIONS[_sec % SECTIONS.length]); _sec++;
  shelfUnit(r.x, cz, -1, SECTIONS[_sec % SECTIONS.length]); _sec++;
}

// (section signs are now hung per shelf unit inside shelfUnit)

// storefront entrance on the south wall (behind the spawn — turn around to see it)
(function entrance() {
  const fz = STORE.d / 2 - 0.06;
  const glass = new THREE.MeshStandardMaterial({ color: 0xbfe0ee, transparent: true, opacity: 0.3, roughness: 0.08, metalness: 0.1, side: THREE.DoubleSide });
  for (const dx of [-0.95, 0.95]) {
    const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.4, 0.05), glass);
    door.position.set(dx, 1.2, fz); scene.add(door);
  }
  const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.5, 0.1), frameMat);
  mullion.position.set(0, 1.25, fz); scene.add(mullion);
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.14, 0.14), frameMat);
  lintel.position.set(0, 2.48, fz); scene.add(lintel);
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const x = cv.getContext('2d');
  x.fillStyle = '#1f7a3d'; x.fillRect(0, 0, 512, 128);
  x.fillStyle = '#ffffff'; x.font = 'bold 66px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('ENTRANCE', 256, 70);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 0.7),
    new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.6, roughness: 0.7, side: THREE.DoubleSide }));
  sign.position.set(0, 2.78, fz - 0.02); scene.add(sign);
})();

// a parked shopping cart for flavour
function cart() {
  const g = new THREE.Group();
  const basket = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.4, 0.8),
    new THREE.MeshStandardMaterial({ color: 0xc2c7cc, roughness: 0.4, metalness: 0.6, transparent: true, opacity: 0.55 }));
  basket.position.y = 0.65; basket.castShadow = true; g.add(basket);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.55, 12), frameMat);
  handle.rotation.z = Math.PI / 2; handle.position.set(0, 0.95, -0.42); g.add(handle);
  for (const dx of [-0.22, 0.22]) for (const dz of [-0.32, 0.32]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 16), mat(0x222222));
    w.rotation.x = Math.PI / 2; w.position.set(dx, 0.07, dz); w.castShadow = true; g.add(w);
  }
  g.position.set(2.0, 0, 2.0);
  scene.add(g);
}
cart();

// first-person cart pushed ahead of the camera (child of the camera)
let cartHold = null;   // group inside the FP cart that holds collected mini-items
const cartMinis = [];  // the mini meshes currently shown in the cart
function firstPersonCart() {
  const g = new THREE.Group();
  const basket = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.34, 0.5),
    new THREE.MeshStandardMaterial({ color: 0xd2d6da, metalness: 0.65, roughness: 0.3, transparent: true, opacity: 0.42 })
  );
  basket.position.set(0, -0.6, -1.0);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.33, 0.012, 8, 24), frameMat);
  rim.rotation.x = Math.PI / 2; rim.scale.set(1.7, 1.3, 1); rim.position.set(0, -0.43, -1.0);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.6, 10), frameMat);
  handle.rotation.z = Math.PI / 2; handle.position.set(0, -0.4, -0.62);
  g.add(basket, rim, handle);
  cartHold = new THREE.Group(); cartHold.position.set(0, -0.74, -1.0); g.add(cartHold);
  g.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
  camera.add(g);
}
firstPersonCart();

// ================================================================ GAME LOGIC
// Core loop ported from the porting bible: shopping list -> walk up & grab ->
// score -> checkout. Plus wandering NPC shoppers for life.
const GAME = { started: false, over: false, score: 0, cart: 0, time: 0, timeLeft: 120, thiefTimer: 16, stolen: 0, round: 1, list: [], checkout: null };

// --- HUD (DOM) ---
function hudEl(css) { const d = document.createElement('div'); d.style.cssText = css; document.body.appendChild(d); return d; }
const HUDBASE = 'position:fixed;color:#fff;font:13px system-ui,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:4;';
const listEl = hudEl(HUDBASE + 'left:14px;top:70px;background:rgba(15,18,22,.55);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 14px;min-width:172px;display:none;');
const scoreEl = hudEl(HUDBASE + 'right:14px;top:14px;text-align:right;font-size:15px;display:none;');
const promptEl = hudEl(HUDBASE + 'left:50%;bottom:88px;transform:translateX(-50%);background:rgba(15,18,22,.72);border-radius:8px;padding:8px 14px;display:none;');
const toastEl = hudEl(HUDBASE + 'left:50%;top:17%;transform:translateX(-50%);font-size:20px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;');
const compassEl = hudEl(HUDBASE + 'left:50%;top:50px;transform:translateX(-50%);background:rgba(15,18,22,.5);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:5px 13px;display:none;font-size:14px;');
const endEl = hudEl('position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,13,.72);z-index:6;color:#fff;font:14px system-ui,sans-serif;');
let toastT = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.style.opacity = '1'; toastT = 2.4; }
function renderList() {
  const rows = GAME.list.map(e => { const done = e.got >= e.need; return `<div style="${done ? 'opacity:.5;text-decoration:line-through;' : ''}">${done ? '✓' : '○'} ${e.name} <span style="opacity:.6">${e.got}/${e.need}</span></div>`; }).join('');
  listEl.innerHTML = `<div style="font-weight:700;margin-bottom:6px;letter-spacing:.5px">SHOPPING LIST</div>${rows}`;
}
function renderScore() {
  const t = Math.max(0, Math.ceil(GAME.timeLeft));
  scoreEl.innerHTML = `Round <b>${GAME.round}</b> · Score <b>${GAME.score}</b> · Cart <b>${GAME.cart}</b><br><span style="font-size:14px;color:${t <= 15 ? '#ff6b6b' : '#fff'}">⏱ ${t}s</span>`;
}

// --- shopping list ---
function genList() {
  const present = new Set(shelfItems.map(s => s.id)); // only list items that exist on a shelf
  const pool = ITEMS.filter(it => it[3] && present.has(it[3])).slice(), out = [];
  for (let i = 0; i < 5 && pool.length; i++) { const k = Math.floor(Math.random() * pool.length); const it = pool.splice(k, 1)[0]; out.push({ id: it[3], name: it[2], need: 1 + (Math.random() < 0.3 ? 1 : 0), got: 0 }); }
  return out;
}
const listComplete = () => GAME.list.length > 0 && GAME.list.every(e => e.got >= e.need);
const roundTime = r => Math.max(45, 120 - (r - 1) * 12);       // tighter each round
const thiefInterval = () => Math.max(8, 16 - GAME.round * 1.5) + Math.random() * 8;
// nearest still-needed product to the player (for the compass)
function nearestNeeded() {
  let best = null, bd = 1e9;
  for (const it of shelfItems) {
    if (it.grabbed) continue;
    if (!GAME.list.find(x => x.id === it.id && x.got < x.need)) continue;
    const d = camera.position.distanceTo(it.pos);
    if (d < bd) { bd = d; best = it; }
  }
  return best ? { pos: best.pos, name: best.name, dist: bd } : null;
}

// --- grab targeting (nearest unclaimed product roughly ahead, within reach) ---
const _vd = new THREE.Vector3(), _vt = new THREE.Vector3();
function findTarget() {
  if (!GAME.started || GAME.over) return null;
  camera.getWorldDirection(_vd);
  let best = null, bestD = 1e9;
  for (const it of shelfItems) {
    if (it.grabbed) continue;
    const d = camera.position.distanceTo(it.pos);
    if (d > 2.2) continue;
    _vt.copy(it.pos).sub(camera.position).normalize();
    if (_vt.dot(_vd) < 0.4) continue;
    if (d < bestD) { bestD = d; best = it; }
  }
  return best;
}
// --- visible cart contents ---
function addCartMini(shape, color, name) {
  if (!cartHold) return;
  const mini = product(shape, color, name);
  mini.scale.setScalar(0.32);
  mini.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
  const n = cartMinis.length, col = n % 3, row = Math.floor(n / 3) % 2, layer = Math.floor(n / 6);
  mini.position.set(-0.16 + col * 0.16, layer * 0.14, -0.1 + row * 0.2);
  cartHold.add(mini); cartMinis.push(mini);
}
function removeCartMini() { const m = cartMinis.pop(); if (m && cartHold) cartHold.remove(m); }
function clearCart() { for (const m of cartMinis) if (cartHold) cartHold.remove(m); cartMinis.length = 0; }

function grab(it) {
  if (!it || it.grabbed) return;
  it.grabbed = true; it.mesh.visible = false; GAME.cart++;
  addCartMini(it.shape, it.color, it.name);
  const entry = GAME.list.find(e => e.id === it.id && e.got < e.need);
  let pts = it.score; if (entry) { entry.got++; pts += 5; }
  GAME.score += pts; toast('+' + pts + '  ' + it.name + (entry ? '  ✓' : ''));
  renderList(); renderScore();
  if (listComplete()) toast('List complete — head to CHECKOUT!');
}

// --- checkout counter ---
(function buildCheckout() {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 0.85), new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.5, metalness: 0.3 }));
  base.position.y = 0.45; base.castShadow = true; base.receiveShadow = true; g.add(base);
  const belt = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.05, 0.55), new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.7 })); belt.position.y = 0.93; g.add(belt);
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64; const x = cv.getContext('2d');
  x.fillStyle = '#1f7a3d'; x.fillRect(0, 0, 256, 64); x.fillStyle = '#fff'; x.font = 'bold 34px system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('CHECKOUT', 128, 34);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.42), new THREE.MeshStandardMaterial({ map: t, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: 0.5, side: THREE.DoubleSide })); sign.position.set(0, 1.85, 0); g.add(sign);
  g.position.set(-4.25, 0, 8); scene.add(g);
  GAME.checkout = new THREE.Vector3(-4.25, 0, 8);
})();

// --- NPC shoppers (wander between random walkable points) ---
const npcs = [];
const NPC_SHIRTS = [0xC0392B, 0x2E86C1, 0x27AE60, 0x8E44AD, 0xE67E22, 0x16A085];
function randomWalkable() { for (let i = 0; i < 40; i++) { const x = (Math.random() * 2 - 1) * 8.0, z = (Math.random() * 2 - 1) * 10.0; if (!blocked(x, z)) return new THREE.Vector3(x, 0, z); } return new THREE.Vector3(0, 0, 0); }
function spawnNpc(i) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.7, 4, 10), new THREE.MeshStandardMaterial({ color: NPC_SHIRTS[i % NPC_SHIRTS.length], roughness: 0.75 })); body.position.y = 0.85; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), new THREE.MeshStandardMaterial({ color: 0xe0b48a, roughness: 0.6 })); head.position.y = 1.42; g.add(head);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.position.copy(randomWalkable()); scene.add(g);
  const sp = 1.0 + Math.random() * 0.8;
  npcs.push({ g, target: randomWalkable(), speed: sp, baseSpeed: sp, state: 'wander', stolen: null });
}
const _nd = new THREE.Vector3();
function updateNpcs(dt) {
  for (const n of npcs) {
    const pos = n.g.position;
    const tgt = n.state === 'toThief' ? camera.position : n.target;
    _nd.copy(tgt).sub(pos); _nd.y = 0;
    const dist = _nd.length();
    if (n.state === 'toThief') {
      if (dist < 1.5) { steal(n); continue; }
    } else if (n.state === 'flee') {
      if (dist < 0.7) { // reached the exit corner — escaped with the goods
        if (n.stolen) { toast('💨 The thief escaped with your ' + n.stolen.name + '.'); n.stolen = null; }
        n.state = 'wander'; n.speed = n.baseSpeed; n.target = randomWalkable(); continue;
      }
    } else { // wander
      if (dist < 0.4) { n.target = randomWalkable(); continue; }
    }
    if (dist < 1e-3) continue;
    _nd.normalize();
    const nx = pos.x + _nd.x * n.speed * dt, nz = pos.z + _nd.z * n.speed * dt;
    let moved = false;
    if (!blocked(nx, pos.z)) { pos.x = nx; moved = true; }
    if (!blocked(pos.x, nz)) { pos.z = nz; moved = true; }
    if (!moved && n.state !== 'toThief') n.target = randomWalkable();
    n.g.rotation.y = Math.atan2(_nd.x, _nd.z);
  }
}

// --- thief mechanic (bible §3.4 §4, adapted to first-person) ---
function pickThief() {
  const cand = npcs.filter(n => n.state === 'wander');
  if (cand.length) { const n = cand[Math.floor(Math.random() * cand.length)]; n.state = 'toThief'; n.speed = 1.8 + GAME.round * 0.15; }
}
function farCorner() {
  const cs = [new THREE.Vector3(-6, 0, -9), new THREE.Vector3(6, 0, -9), new THREE.Vector3(-6, 0, 9), new THREE.Vector3(6, 0, 9)];
  let best = cs[0], bd = -1;
  for (const c of cs) { const d = c.distanceTo(camera.position); if (d > bd) { bd = d; best = c; } }
  return best;
}
function steal(n) {
  const entry = GAME.list.find(e => e.got > 0);
  if (!entry) { n.state = 'wander'; n.target = randomWalkable(); return; }
  entry.got--; GAME.cart = Math.max(0, GAME.cart - 1); GAME.stolen++; removeCartMini();
  n.stolen = entry; n.state = 'flee'; n.speed = 2.4 + GAME.round * 0.2; n.target = farCorner();
  renderList(); renderScore();
  toast('🦹 A shopper snatched your ' + entry.name + '! Chase them — press E!');
}
function fleeingThiefNear(r) {
  for (const n of npcs) if (n.state === 'flee' && n.stolen && n.g.position.distanceTo(camera.position) < r) return n;
  return null;
}
function recover(n) {
  if (!n || !n.stolen) return;
  const e = n.stolen; e.got++; GAME.cart++; GAME.stolen = Math.max(0, GAME.stolen - 1); GAME.score += 10;
  const def = ITEMS.find(t => t[3] === e.id); if (def) addCartMini(def[0], def[1], def[2]);
  n.stolen = null; n.state = 'wander'; n.speed = n.baseSpeed; n.target = randomWalkable();
  renderList(); renderScore();
  toast('✓ Got your ' + e.name + ' back! +10');
}

// --- master per-frame game update ---
function updateGame(dt) {
  GAME.time += dt;
  GAME.timeLeft -= dt;
  if (GAME.timeLeft <= 0) { GAME.timeLeft = 0; gameOver(); return; }
  GAME.thiefTimer -= dt;
  if (GAME.thiefTimer <= 0 && GAME.list.some(e => e.got > 0) && !npcs.some(n => n.state !== 'wander')) {
    pickThief(); GAME.thiefTimer = thiefInterval();
  }
  updateNpcs(dt);
  const close = fleeingThiefNear(0.9); // forgiving auto-catch on contact
  if (close) recover(close);
  updateHud(dt);
}

// --- per-frame HUD + lifecycle ---
function updateHud(dt) {
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.style.opacity = '0'; }
  renderScore();
  // compass: arrow to nearest needed item, or to checkout when the list is done
  let cTarget = null, cLabel = '';
  if (listComplete()) { cTarget = GAME.checkout; cLabel = 'CHECKOUT'; }
  else { const nn = nearestNeeded(); if (nn) { cTarget = nn.pos; cLabel = nn.name; } }
  if (cTarget) {
    const cf = camera.getWorldDirection(new THREE.Vector3());
    const rel = Math.atan2(cTarget.x - camera.position.x, cTarget.z - camera.position.z) - Math.atan2(cf.x, cf.z);
    compassEl.style.display = 'block';
    compassEl.innerHTML = `<span style="display:inline-block;transform:rotate(${(rel * 180 / Math.PI).toFixed(0)}deg)">↑</span> ${cLabel} · ${Math.round(camera.position.distanceTo(cTarget))}m`;
  } else compassEl.style.display = 'none';
  const thief = fleeingThiefNear(2.4);
  if (thief) { promptEl.style.display = 'block'; promptEl.textContent = '[E] Catch the thief! (' + thief.stolen.name + ')'; return; }
  if (GAME.checkout && camera.position.distanceTo(GAME.checkout) < 2.5) {
    promptEl.style.display = 'block';
    promptEl.textContent = listComplete() ? '[E] Checkout' : '[E] Checkout (list unfinished)';
    return;
  }
  const t = findTarget();
  if (t) { promptEl.style.display = 'block'; promptEl.textContent = '[E] Grab ' + t.name; }
  else promptEl.style.display = 'none';
}
function startGame() {
  if (GAME.started) return;
  GAME.started = true; GAME.over = false; GAME.score = 0; GAME.cart = 0; GAME.time = 0;
  GAME.round = 1; GAME.timeLeft = roundTime(1); GAME.thiefTimer = 16; GAME.stolen = 0;
  GAME.list = genList(); renderList(); renderScore();
  listEl.style.display = 'block'; scoreEl.style.display = 'block';
  for (let i = 0; i < 9; i++) spawnNpc(i);
  toast('Grab your list with E — watch for thieves — then CHECKOUT');
}
function interact() {
  if (!GAME.started || GAME.over) return;
  const thief = fleeingThiefNear(1.8);
  if (thief) { recover(thief); return; }
  if (GAME.checkout && camera.position.distanceTo(GAME.checkout) < 2.5) {
    if (listComplete()) advanceRound(); else toast('Finish your list before checkout!');
    return;
  }
  grab(findTarget());
}
function advanceRound() {
  const timeBonus = Math.floor(Math.max(0, GAME.timeLeft)) * 2;
  GAME.score += 300 + timeBonus;
  const cleared = GAME.round;
  GAME.round++;
  clearCart(); GAME.cart = 0; // bagged at checkout — cart starts empty next round
  GAME.list = genList(); renderList();
  GAME.timeLeft = roundTime(GAME.round);
  GAME.thiefTimer = thiefInterval();
  // reset any in-progress thief for the new round
  for (const n of npcs) { if (n.state !== 'wander') { n.state = 'wander'; n.stolen = null; n.speed = n.baseSpeed; n.target = randomWalkable(); } }
  renderScore();
  toast('✓ Round ' + cleared + ' cleared!  +' + (300 + timeBonus) + '   →  Round ' + GAME.round);
}
function gameOver() {
  if (GAME.over) return;
  GAME.over = true;
  let best = +(localStorage.getItem('gd_best') || 0);
  const newBest = GAME.score > best; best = Math.max(best, GAME.score);
  try { localStorage.setItem('gd_best', best); } catch (e) {}
  if (document.exitPointerLock) document.exitPointerLock();
  promptEl.style.display = 'none'; compassEl.style.display = 'none';
  endEl.style.display = 'flex';
  endEl.innerHTML = `<div style="background:rgba(15,18,22,.92);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:28px 36px;text-align:center;max-width:380px">
    <h1 style="margin:0 0 8px;font-size:24px">Time's up!</h1>
    <p style="opacity:.82;margin:4px 0">Rounds cleared: <b>${GAME.round - 1}</b> · Items stolen: <b>${GAME.stolen}</b></p>
    <h2 style="margin:14px 0 6px;font-size:30px">Score ${GAME.score}</h2>
    <p style="opacity:.8;margin:2px 0 16px">${newBest ? '🏆 New best!' : 'Best ' + best}</p>
    <div onclick="location.reload()" style="cursor:pointer;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:9px 16px;display:inline-block">Play again</div>
  </div>`;
}

// ---------------------------------------------------------------- controls
const controls = new PointerLockControls(camera, renderer.domElement);
const overlay = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');
overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => { overlay.style.display = 'none'; crosshair.style.display = 'block'; startGame(); });
controls.addEventListener('unlock', () => { overlay.style.display = 'flex'; crosshair.style.display = 'none'; });

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyE') interact(); requestRender(); });
addEventListener('keyup', e => { keys[e.code] = false; requestRender(); });

const PLAYER_R = 0.35, SPEED = 3.2;
function blocked(x, z) {
  if (x < -STORE.w / 2 + PLAYER_R || x > STORE.w / 2 - PLAYER_R) return true;
  if (z < -STORE.d / 2 + PLAYER_R || z > STORE.d / 2 - PLAYER_R) return true;
  for (const b of shelfBoxes)
    if (x > b.minX - PLAYER_R && x < b.maxX + PLAYER_R && z > b.minZ - PLAYER_R && z < b.maxZ + PLAYER_R) return true;
  return false;
}

const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();

// Render on demand: one frame on any change, and a continuous loop only while
// the pointer is locked (so the page goes idle when static — lets screenshot
// tooling capture, and saves the GPU when nobody's moving).
function requestRender() {} // no-op: the loop runs continuously now (NPCs + HUD need per-frame updates)
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (controls.isLocked) {
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up).normalize();
    let mx = 0, mz = 0;
    if (keys['KeyW'] || keys['ArrowUp']) mz += 1;
    if (keys['KeyS'] || keys['ArrowDown']) mz -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
    if (mx || mz) {
      const dir = new THREE.Vector3().addScaledVector(fwd, mz).addScaledVector(right, mx).normalize();
      const p = camera.position;
      const nx = p.x + dir.x * SPEED * dt, nz = p.z + dir.z * SPEED * dt;
      if (!blocked(nx, p.z)) p.x = nx;
      if (!blocked(p.x, nz)) p.z = nz;
    }
    camera.position.y = 1.62;
  }
  if (GAME.started && !GAME.over) updateGame(dt);
  composer.render();
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  requestRender();
});

// signal for headless screenshot tooling
window.__scene = scene; window.__renderer = renderer; window.__camera = camera; window.__composer = composer;
window.__GAME = GAME; window.__shelfItems = shelfItems; window.__npcs = npcs;
window.__startGame = startGame; window.__grab = grab; window.__interact = interact; window.__advanceRound = advanceRound; window.__gameOver = gameOver; window.__nearestNeeded = nearestNeeded;
window.__updateNpcs = updateNpcs; window.__updateGame = updateGame; window.__steal = steal; window.__recover = recover; window.__fleeingThiefNear = fleeingThiefNear; window.__cartMinis = cartMinis;
window.__ready = true;
} catch (e) {
  window.__err = (e && e.stack) || String(e);
  const pre = document.createElement('pre');
  pre.style.cssText = 'position:fixed;inset:0;margin:0;padding:16px;color:#f55;background:#111;font:12px monospace;white-space:pre-wrap;z-index:99;overflow:auto';
  pre.textContent = window.__err;
  document.body.appendChild(pre);
}
</script>
</body>
